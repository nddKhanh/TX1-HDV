
name: Shop Management CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile project
        run: mvn --batch-mode clean compile

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        run: mvn --batch-mode test

  package:
    name: Package
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Package JAR
        run: mvn --batch-mode package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: shop-management-jar
          path: target/*.jar
          if-no-files-found: error

  deploy:
    name: Deploy to Minikube
    needs: package
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: shop-management-jar
          path: target

      - name: Check Minikube
        shell: powershell
        run: |
          minikube status
          minikube kubectl -- get nodes

      - name: Build Docker image
        shell: powershell
        run: |
          minikube image build -t shop-management-app:latest .

      - name: Deploy MySQL
        shell: powershell
        run: |
          minikube kubectl -- apply -f k8s/mysql-deployment.yml
          minikube kubectl -- rollout status deployment/mysql --timeout=180s

      - name: Deploy Spring Boot
        shell: powershell
        run: |
          minikube kubectl -- apply -f k8s/app-deployment.yml
          minikube kubectl -- rollout restart deployment/shop-app
          minikube kubectl -- rollout status deployment/shop-app --timeout=300s

      - name: Check deployment
        shell: powershell
        run: |
          minikube kubectl -- get pods
          minikube kubectl -- get services
