
name: Shop Management CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # =========================
  # 1. BUILD
  # =========================
  build:
    name: Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: TX1

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: TX1/pom.xml

      - name: Compile project
        run: mvn --batch-mode clean compile

  # =========================
  # 2. TEST WITH MYSQL
  # =========================
  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: TX1

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: shop_management
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: TX1/pom.xml

      - name: Run tests
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/shop_management?useSSL=false&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: rootpassword
          SPRING_JPA_HIBERNATE_DDL_AUTO: update
        run: mvn --batch-mode test

  # =========================
  # 3. PACKAGE
  # =========================
  package:
    name: Package
    needs: test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: TX1

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: TX1/pom.xml

      - name: Package JAR
        run: mvn --batch-mode package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: shop-management-jar
          path: TX1/target/*.jar
          if-no-files-found: error

  # =========================
  # 4. DEPLOY TO MINIKUBE
  # =========================
  deploy:
    name: Deploy to Minikube
    needs: package
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: shop-management-jar
          path: TX1/target

      - name: Check Minikube
        shell: powershell
        run: |
          minikube status
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          minikube kubectl -- get nodes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Docker image
        shell: powershell
        run: |
          minikube image build -t shop-management-app:latest .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Deploy MySQL
        shell: powershell
        run: |
          minikube kubectl -- apply -f k8s/mysql-deployment.yml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          minikube kubectl -- rollout status deployment/mysql --timeout=180s
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Deploy Spring Boot
        shell: powershell
        run: |
          minikube kubectl -- apply -f k8s/app-deployment.yml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          minikube kubectl -- rollout restart deployment/shop-app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          minikube kubectl -- rollout status deployment/shop-app --timeout=300s
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply ServiceMonitor
        shell: powershell
        run: |
          minikube kubectl -- apply -f k8s/app-service-monitor.yml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check deployment
        shell: powershell
        run: |
          minikube kubectl -- get pods
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          minikube kubectl -- get services
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
