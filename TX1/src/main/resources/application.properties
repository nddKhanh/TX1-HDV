spring.datasource.url=jdbc:mysql://localhost:3306/shop_management?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Bangkok
spring.datasource.username=root
spring.datasource.password=123456
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
server.port=8081
# Actuator endpoints
management.endpoints.web.exposure.include=health,info,prometheus

# Application metric tag
management.metrics.tags.application=shop-management

# HTTP request latency histogram
management.metrics.distribution.percentiles-histogram.http.server.requests=true