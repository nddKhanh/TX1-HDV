<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Danh mục</title><link rel="stylesheet" th:href="@{/style.css}"></head><body><main><a th:href="@{/categories}">← Danh sách danh mục</a><h1 th:text="${category.id == null ? 'Thêm danh mục' : 'Sửa danh mục'}"></h1><form method="post" th:action="@{/categories/save}" th:object="${category}"><input type="hidden" th:field="*{id}"><label>Tên danh mục <input th:field="*{name}" required></label><small class="error" th:errors="*{name}"></small><label>Mô tả <textarea th:field="*{description}"></textarea></label><button type="submit">Lưu</button></form></main></body></html>
