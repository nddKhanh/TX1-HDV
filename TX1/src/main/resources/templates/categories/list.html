<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Danh mục</title><link rel="stylesheet" th:href="@{/style.css}"></head><body><main><nav><a th:href="@{/products}">Sản phẩm</a> · <a th:href="@{/categories}">Danh mục</a></nav><h1>Quản lý danh mục</h1><p th:if="${error}" class="error" th:text="${error}"></p><p th:if="${success}" th:text="${success}"></p><a class="button" th:href="@{/categories/new}">+ Thêm danh mục</a><table><thead><tr><th>ID</th><th>Tên</th><th>Mô tả</th><th>Thao tác</th></tr></thead><tbody><tr th:each="c : ${categories}"><td th:text="${c.id}"></td><td th:text="${c.name}"></td><td th:text="${c.description}"></td><td><a th:href="@{/categories/{id}/edit(id=${c.id})}">Sửa</a> <form class="inline" th:action="@{/categories/{id}/delete(id=${c.id})}" method="post" onsubmit="return confirm('Xóa danh mục này?')"><button type="submit">Xóa</button></form></td></tr></tbody></table></main></body></html>
