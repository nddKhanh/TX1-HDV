<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Sản phẩm</title><link rel="stylesheet" th:href="@{/style.css}"></head><body><main><a th:href="@{/products}">← Danh sách sản phẩm</a><h1 th:text="${productForm.id == null ? 'Thêm sản phẩm' : 'Sửa sản phẩm'}"></h1><form method="post" th:action="@{/products/save}" th:object="${productForm}"><input type="hidden" th:field="*{id}"><label>Tên sản phẩm <input th:field="*{name}" required></label><small class="error" th:errors="*{name}"></small><label>Giá <input type="number" step="any" min="0.01" th:field="*{price}" required></label><small class="error" th:errors="*{price}"></small><label>Tồn kho <input type="number" min="0" th:field="*{stock}" required></label><small class="error" th:errors="*{stock}"></small><label>Danh mục <select th:field="*{categoryId}" required><option value="">-- Chọn danh mục --</option><option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option></select></label><small class="error" th:errors="*{categoryId}"></small><button type="submit">Lưu</button></form></main></body></html>
