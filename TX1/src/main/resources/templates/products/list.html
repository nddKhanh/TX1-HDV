<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Sản phẩm</title><link rel="stylesheet" th:href="@{/style.css}"></head><body><main><nav><a th:href="@{/products}">Sản phẩm</a> · <a th:href="@{/categories}">Danh mục</a></nav><h1>Quản lý sản phẩm</h1><form method="get" th:action="@{/products}" class="filters"><input name="keyword" placeholder="Tìm theo tên" th:value="${keyword}"><select name="categoryId"><option value="">Tất cả danh mục</option><option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${categoryId == c.id}"></option></select><button>Tìm / Lọc</button></form><a class="button" th:href="@{/products/new}">+ Thêm sản phẩm</a><table><thead><tr><th>ID</th><th>Tên</th><th>Giá</th><th>Tồn kho</th><th>Danh mục</th><th>Thao tác</th></tr></thead><tbody><tr th:each="p : ${products.content}"><td th:text="${p.id}"></td><td th:text="${p.name}"></td><td th:text="${#numbers.formatDecimal(p.price,1,2)}"></td><td th:text="${p.stock}"></td><td th:text="${p.category.name}"></td><td><a th:href="@{/products/{id}/edit(id=${p.id})}">Sửa</a> <form class="inline" th:action="@{/products/{id}/delete(id=${p.id})}" method="post" onsubmit="return confirm('Xóa sản phẩm này?')"><button type="submit">Xóa</button></form></td></tr><tr th:if="${products.empty}"><td colspan="6">Không có sản phẩm.</td></tr></tbody></table><p th:if="${products.totalPages > 0}">Trang <span th:text="${products.number+1}"></span>/<span th:text="${products.totalPages}"></span></p><div class="pages"><a th:if="${products.hasPrevious()}" th:href="@{/products(page=${products.number-1},keyword=${keyword},categoryId=${categoryId})}">← Trước</a><a th:if="${products.hasNext()}" th:href="@{/products(page=${products.number+1},keyword=${keyword},categoryId=${categoryId})}">Sau →</a></div></main></body></html>
